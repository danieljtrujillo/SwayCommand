appId: app.akswayj
productName: AKSWAYJ
copyright: MIT — unaffiliated with Audima Labs

directories:
  output: release
  buildResources: build

files:
  - src/main/**/*
  - src/preload/**/*
  - src/shared/**/*
  - dist/**/*
  - projects/**/*
  - docs/**/*.md
  - README.md
  - package.json

asar: true

win:
  target:
    - nsis
  icon: build/icon.ico

nsis:
  # The "double-click and it just works" file: one click installs, launches
  # straight into the Doctor, and the Doctor takes it from there.
  oneClick: true
  perMachine: false
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  artifactName: AKSWAYJ-Setup-${version}.${ext}

mac:
  target:
    - dmg
  icon: build/icon.png
  category: public.app-category.music

linux:
  target:
    - AppImage
  icon: build/icon.png
  category: AudioVideo
  synopsis: Gesture VJ instrument for the Audima Labs Sway
